<!DOCTYPE html>
<html>
<head>
    <title>YouTube Style Cards</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f9f9f9;
        }

        .video-card img {
            border-radius: 12px;
        }

        .video-card:hover {
            transform: scale(1.03);
            transition: 0.3s;
        }

        .channel-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row g-4">

        <!-- Video Card 1 -->
        <div class="col-md-4">
            <div class="card video-card border-0 shadow-sm">
                <img src="https://via.placeholder.com/350x200" class="card-img-top">
                
                <div class="card-body">
                    <div class="d-flex">
                        <img src="https://via.placeholder.com/40" class="channel-img me-3">
                        
                        <div>
                            <h6 class="mb-1 fw-bold">
                                Learn Bootstrap in 30 Minutes
                            </h6>
                            <p class="text-muted small mb-0">
                                Code Academy
                            </p>
                            <p class="text-muted small">
                                1M views • 2 days ago
                            </p>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Video Card 2 -->
        <div class="col-md-4">
            <div class="card video-card border-0 shadow-sm">
                <img src="https://via.placeholder.com/350x200" class="card-img-top">
                
                <div class="card-body">
                    <div class="d-flex">
                        <img src="https://via.placeholder.com/40" class="channel-img me-3">
                        
                        <div>
                            <h6 class="mb-1 fw-bold">
                                JavaScript Full Course
                            </h6>
                            <p class="text-muted small mb-0">
                                Web Dev Channel
                            </p>
                            <p class="text-muted small">
                                800K views • 1 week ago
                            </p>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Video Card 3 -->
        <div class="col-md-4">
            <div class="card video-card border-0 shadow-sm">
                <img src="https://via.placeholder.com/350x200" class="card-img-top">
                
                <div class="card-body">
                    <div class="d-flex">
                        <img src="https://via.placeholder.com/40" class="channel-img me-3">
                        
                        <div>
                            <h6 class="mb-1 fw-bold">
                                CSS Animation Tricks
                            </h6>
                            <p class="text-muted small mb-0">
                                Design Pro
                            </p>
                            <p class="text-muted small">
                                250K views • 3 days ago
                            </p>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

</body>
</html>
