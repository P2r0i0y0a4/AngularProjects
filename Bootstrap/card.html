<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idly Kadai</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #F7F3E9;
            font-family: Arial, sans-serif;
        }

        /* Navbar */
        .navbar {
            background-color: #2F5D50;
        }

        .navbar .nav-link,
        .navbar .navbar-brand {
            color: white !important;
            font-weight: 500;
        }

        /* Cards */
        .card {
            background-color: #FFFDF7;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        /* Card Image */
        .card-img-top {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        /* Buttons */
        .btn-cart {
            background-color: #FF7A30;
            border: none;
            border-radius: 25px;
            color: white;
        }

        .btn-cart:hover {
            background-color: #E35D1F;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">My Idly Kadai</a>

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="#">Home</a>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        About
                    </a>

                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Quality</a></li>
                        <li><a class="dropdown-item" href="#">Price</a></li>
                        <li><a class="dropdown-item" href="#">Delivery</a></li>
                    </ul>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Contact</a>
                </li>

            </ul>
        </div>
    </nav>
     <div class="container mt-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a href="#">Home</a>
                </li>
                <li class="breadcrumb-item">
                    <a href="#">About</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">
                    Quality 
                </li>
            </ol>
        </nav>
    </div>
    <br>

    <center>
        <h1>Idly Varieties 💕</h1>
    </center>

    <div class="container">
        <div class="row g-4 mt-4">

            <div class="col-md-3">
                <div class="card shadow">
                    <img src="./idly2.avif" class="card-img-top">
                    <div class="card-body">
                        <h5>Kanchi Idly</h5>
                        <p>Soft Idly</p>
                        <button class="btn btn-cart">Add to cart</button>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow">
                    <img src="./idly3.webp" class="card-img-top">
                    <div class="card-body">
                        <h5>Rava Idly</h5>
                        <p>Hungry Idly</p>
                        <button class="btn btn-cart">Add to cart</button>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow">
                    <img src="./idly4.webp" class="card-img-top">
                    <div class="card-body">
                        <h5>Podi Idly</h5>
                        <p>Spicy, tasty Idly</p>
                        <button class="btn btn-cart">Add to cart</button>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow">
                    <img src="./idly1.jpg" class="card-img-top">
                    <div class="card-body">
                        <h5>Mini Idly</h5>
                        <p>Soft Idly</p>
                        <button class="btn btn-cart">Add to cart</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
