<nav class="navbar navbar-dark" style="background-color:#1f1f1f;">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 p-4 h1">ShopEasy</span>
  </div>
</nav>

<section class="text-center text-white d-flex align-items-center justify-content-center"
  style="height:300px; background: #DD2D4A;">

  <div>
    <h1 style="font-size:40px; font-weight:500;">Welcome to ShopEasy</h1>
    <p style="font-size:16px;">Best products at best prices</p>
    <button class="btn btn-light">Shop Now</button>
  </div>

</section>

<div class="container mt-5">
  <div class="row g-4 justify-content-center">

    <div class="col-md-4">
      <div class="card shadow" style="border-radius:10px;">
        <img [src]="img1" class="card-img-top"
          style="height:200px; object-fit:cover;">

        <div class="card-body text-center">
          <h5>Shoes</h5>
          <p>₹ 1999</p>
          <button class="btn btn-danger w-100" (click)="addToCart()">Add to Cart</button>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow" style="border-radius:10px;">
        <img [src]="img2" class="card-img-top"
          style="height:200px; object-fit:cover;">

        <div class="card-body text-center">
          <h5>Watch</h5>
          <p>₹ 2999</p>
          <button class="btn btn-danger w-100" (click)="addToCart()">Add to Cart</button>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow" style="border-radius:10px;">
        <img [src]="img3" class="card-img-top"
          style="height:200px; object-fit:cover;">

        <div class="card-body text-center">
          <h5>Bag</h5>
          <p>₹ 1499</p>
          <button class="btn btn-danger w-100 " (click)="addToCart()">Add to Cart</button>
        </div>
      </div>
    </div>

  </div>
</div>

<footer class="text-center text-white mt-5 p-3"
  style="background-color:#1f1f1f;">
  &COPY; 2026 ShopEasy
</footer>
