<section class="p-4">
    <h1 class="text-3xl flex justify-center">Cart</h1>
    <section class=" m-auto w-200 h-30 border-2 flex justify-center rounded-2xl mt-10 p-4 flex gap-5 shadow-2xl shadow-black bg-blue-100">
        <img [src]="img" alt="" class="h-20 w-20">
        <p>{{productName}}</p>
        <p class="font-black text-[18px]">{{productPrice}}</p>
         <p>Qty: {{qty}}</p>
        <button class="bg-blue-400 text-white p-2 flex justify-center h-10 rounded hover:bg-gray-500" (click)="increment()">Increment</button>
    </section>
</section>
