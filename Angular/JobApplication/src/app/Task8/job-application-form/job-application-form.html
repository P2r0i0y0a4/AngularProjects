<!-- <p>job-application-form works!</p> -->
<section class="h-screen flex items-center justify-center bg-gray-100">
    
    <form #myForm="ngForm" (ngSubmit)="handleSubmit(myForm)" class="bg-white shadow-lg rounded-xl p-8 w-105 space-x-4">
        <h2 class="text-4xl font-black text-center text-blue-700 mb-3">JobApplication Form</h2>
        <!-- input elements inside one div -->
        <div>
            <label for="">Full Name</label>
            <input type="text" 
                   name="name" required
                   #name = "ngModel"
                   ngModel
                   class="w-full border p-2 rounded mt-1">
            @if(name.invalid && name.touched){
                <p class="text-sm text-red-500">name is required</p>
            }
        </div>
        <div>
            <label for="">Email</label>
            <input type="text"  required
                   name="email" 
                   email
                   #email = "ngModel"
                   pattern="^[a-z0-9._+-]+@[a-z]{2,}$"
                   ngModel
                   class="w-full border p-2 rounded mt-1">
            <!-- @if(myForm.controls['email']?.invalid && myForm.controls['email']?.touched){
                <p class="text-sm text-red-500">
                    email is required</p>
            } -->
            @if(email.invalid && email.touched){
                <p class="text-sm text-red-500">
                    email is required</p>
            }
            @if(email.errors?.['email'] && email.errors?.['pattern'] && email.touched){
                <p class="text-sm text-red-500">Invalid email</p>
            }
        </div>
        <div>
            <label for="">Gender</label>
            <input type="radio" name="gender" ngModel value="male">Male
            <input type="radio" name="gender" ngModel value="female" >Female
            <input type="radio" name="gender" ngModel value="others" >Other
        </div>
        <div>
            <label > Skills </label>
            <input type="checkbox" (change)="handleSkill($event,'html')">HTML
            <input type="checkbox" (change)="handleSkill($event,'css')">CSS
            <input type="checkbox" (change)="handleSkill($event,'javascript')">Javascript
            <input type="checkbox" (change)="handleSkill($event,'typescript')">Typescript
        </div>
        <!-- Submit block -->
        <div>
            <button type="submit" class="bg-blue-600 rounded text-2xl text-white p-2 mt-3">Submit</button>
        </div>
    </form>
</section>
