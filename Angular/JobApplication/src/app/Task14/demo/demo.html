<section class="h-screen w-full flex justify-center items-center shadow-2xl">
    <div class="border w-90 bg-cyan-50 p-3">
        <h1 class="text-2xl text-center text-blue-950">Login Form</h1>
        <form [formGroup]="loginData" (ngSubmit)="login()">
            <div class="p-2">
                <label for="">Name :</label>
                <input type="text" formControlName="name" class="border p-1 w-full">
            </div>
            <div class="p-2">
                <label for="">Email :</label>
                <input type="email" formControlName="email" class="border p-1 w-full">
            </div>
            <button type="submit" class="border w-full text-2xl mt-3 bg-blue-200">Submit</button>
        </form>
    </div>
</section>
