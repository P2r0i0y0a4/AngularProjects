<section class="h-screen w-full bg-slate-100 flex justify-center items-center">
    <div class="w-80 bg-white rounded-2xl shadow-2xl shadow-violet-500">
        <form class="p-4" [formGroup]="form"(ngSubmit)="handleSubmit()" >
            <h1 class="text-3xl text-violet-800 font-black p-3 text-center">Reactive Form</h1>
            <div>
                <input type="text"
                       placeholder = "Name"
                       class="bg-violet-200 rounded-2xl text-violet-950 p-2 mb-5 w-full" formControlName="name">
            </div>
             <div>
                <input type="email"
                       placeholder = "Email"
                       class="bg-violet-200 rounded-2xl text-violet-950 p-2 mb-5 w-full" formControlName="email">
            </div>
             <div>
                <input type="password"
                       placeholder = "Password"
                       class="bg-violet-200 rounded-2xl text-violet-950 p-2 mb-5 w-full" formControlName="password">
            </div>
            <button type="submit" class="text-white bg-violet-700 p-2 rounded-2xl w-full mb-3">Submit</button>
        </form>
    </div>
</section>
