<section class="h-full w-full flex justify-center items-center bg-gradient-to-r from-green-200 via-green-300 to-emerald-500 p-5">

    <!-- MAIN CARD -->
    <div class="flex w-full max-w-4xl rounded-2xl overflow-hidden shadow-2xl  bg-transparent">

        <!-- LEFT IMAGE SIDE -->
        <div class="w-1/2 hidden md:block relative">
            <img src="https://cdn.pixabay.com/photo/2026/03/10/05/58/05-58-44-680_1280.jpg"
                class="h-full w-full object-cover">
        </div>

        <!-- RIGHT FORM SIDE -->
        <div class="w-full md:w-1/2 bg-white p-8 flex justify-center items-center">

            <!-- YOUR LOGIN FORM (UNCHANGED LOGIC) -->
            <div class="w-full max-w-sm">
                <form [formGroup]="form" (ngSubmit)="handleSubmit()" class="space-y-6">

                    <h1 class="text-3xl font-bold text-gray-700 text-center">Login</h1>

                    <!-- EMAIL -->
                    <input type="text" placeholder="Email" formControlName="email"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-gray-50 outline-none focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all" />

                    @if(email?.errors?.['required'] && email?.touched){
                    <p class="text-sm text-red-500">Email is required</p>
                    }

                    @if(email?.errors?.['email']){
                    <p class="text-sm text-red-500">Enter valid email</p>
                    }

                    <!-- PASSWORD -->
                    <input type="password" placeholder="Password" formControlName="password"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 bg-gray-50 outline-none focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all" />

                    @if(password?.errors?.['required'] && password?.touched){
                    <p class="text-sm text-red-500">Password is required</p>
                    }

                    @if(password?.errors?.['minlength']){
                    <p class="text-sm text-red-500">Minimum 6 characters required</p>
                    }

                    <!-- BUTTON -->
                    <button type="submit" [disabled]="form.invalid"
                        class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 active:scale-95 transition-all shadow-lg disabled:bg-gray-400">
                        Login
                    </button>

                </form>
            </div>

        </div>
    </div>
</section>
