<!-- <p>role-based-dashboard works!</p> -->
<section>
   <h1 class="text-center text-5xl">Switch Case Structural directive</h1> <br>
   <div class="border border-blue-200 bg-blue-100 text-4xl text-blue-950 shadow-2xl">
     @switch (role) {
        @case ('admin') {
            <h1>Logged in to admin dashboard</h1>
        }
        @case ('user') {
            <h1>Logged in to user dashboard</h1>
        }
        @default {
            <h1>Invalid user</h1>
        }
    }
   </div>
</section>
