<section class="bg-white min-h-screen flex justify-center items-center p-6">
  <div class="bg-slate-100 p-8 rounded-2xl shadow-xl w-full max-w-md">
    <h2 class="text-3xl font-black text-blue-950 mb-6 text-center">Add Product</h2>

    <form (ngSubmit)="onSubmit()" #productForm="ngForm">

      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-1">Title</label>
        <input
          type="text"
          [(ngModel)]="formData.title"
          name="title"
          required
          class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="Product title"
        />
      </div>

      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-1">Price (₹)</label>
        <input
          type="number"
          [(ngModel)]="formData.price"
          name="price"
          required
          class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="0"
        />
      </div>

      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-1">Category</label>
        <input
          type="text"
          [(ngModel)]="formData.category"
          name="category"
          required
          class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="e.g. electronics"
        />
      </div>

      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-1">Description</label>
        <textarea
          [(ngModel)]="formData.description"
          name="description"
          required
          rows="3"
          class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="Product description"
        ></textarea>
      </div>

      <div class="mb-6">
        <label class="block text-sm font-semibold text-gray-700 mb-1">Image URL</label>
        <input
          type="url"
          [(ngModel)]="formData.image"
          name="image"
          class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
          placeholder="https://..."
        />
      </div>

      <button
        type="submit"
        [disabled]="productForm.invalid || isLoading"
        class="w-full bg-blue-500 text-white font-bold py-2 rounded-lg hover:bg-blue-600 disabled:opacity-50 transition">
        {{ isLoading ? 'Submitting...' : 'ADD PRODUCT' }}
      </button>

    </form>

    @if(responseMessage) {
      <p class="mt-4 text-center font-semibold text-gray-700">{{ responseMessage }}</p>
    }
  </div>
</section>
