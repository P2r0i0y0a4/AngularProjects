<div class="bg-white rounded-lg shadow-lg p-4">
  <img [src]="car.image" class="rounded-md w-full h-40 object-cover" />

  <p class="text-blue-600 text-sm font-bold mt-2">{{ car.status }}</p>

  <h2 class="text-xl font-bold mt-2">{{ car.name }}</h2>

  <p class="text-gray-500 text-sm">{{ car.series }}</p>
  <div class="flex justify-between text-sm mt-3">
    <p>{{ car.power }}</p>
    <p>{{ car.fuel }}</p>
    <p>{{ car.year }}</p>
  </div>

  <div class="flex justify-between items-center mt-4">
    <p class="text-xl font-bold">${{ car.price }}</p>
    <button class="bg-gray-900 text-white px-5 py-2 rounded">DETAILS</button>
  </div>
</div>
