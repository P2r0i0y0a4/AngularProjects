<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
  .margin{
  background: #66d12d;
  padding: 40px;
  font-weight: 900;
  margin: 10%;
  padding-bottom: 30px;
  padding-top: 30px;
  padding-left: 20px;
  padding-right: 20px;
  font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
}

.border{
  background: #f1a500;
  padding: 40px;
  margin: 20px;
  padding-top: 20px;
  border: 2px solid #f1a500;
}

.padding{
  background: #00aaff;
  padding: 40px;
  padding-top: 20px;
  padding-bottom: 40px;
}

.content{
  background: #ff2a1a;
  padding: 40px;
  color: white;
  text-align: center;
  font-size: 20px;
}
.label {
  text-align: center;
  font-weight: bolder;
  margin-bottom: 10px;
}
    </style>
</head>
<body>
    <div class="margin">
  <div class="label">Margin</div>

  <div class="border">
    <div class="label">Border</div>

    <div class="padding">
      <div class="label">Padding</div>

      <div class="content">
        Content
      </div>

    </div>
  </div>
</div>
</body>
</html>
