.top{
    text-align:center;
    padding:15px;
    font-size:28px;
    font-weight:bold;
    color:white;
    background-image:url("./header.jpg");
    background-size:cover;
}

/* Navbar */
.navbar{
    display:flex;
    justify-content:space-around;
    align-items:center;
    background-color:#d8e2dc;
    padding:10px;
}

.logo{
    width:80px;
    height:80px;
    border-radius:10px;
}

.navbar ul{
    display:flex;
    list-style:none;
    gap:25px;
    font-weight:500;
}

.navbar li{
    cursor:pointer;
}

.navbar li:hover{
    color:green;
}

.navbar input{
    padding:5px;
}

.navbar select{
    padding:5px;
}

/* Hero Section */
.hero{
    height:90vh;
    background-image:url("./idly1.jpg");
    background-size:cover;
    background-position:center;
}

.overlay{
    height:100%;
    background:rgba(0,0,0,0.3);
    display:flex;
    align-items:center;
    padding-left:80px;
}

.menu-box{
    background:rgba(255,255,255,0.85);
    padding:40px;
    width:300px;
    border-radius:10px;
}

.menu-box h1{
    margin-bottom:15px;
}

.menu-box ul{
    list-style:none;
}

.menu-box li{
    padding:6px 0;
}

.menu-box button{
    margin-top:15px;
    padding:8px 15px;
    background-color:green;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.menu-box button:hover{
    background-color:darkgreen;
}

/* Footer */
footer{
    text-align:center;
    padding:20px;
    background-color:#d8e2dc;
}
