<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h2>Personal Details</h2>
    <form action="">
        <fieldset>
            <legend>Personal Details</legend>
        <label for="">Salutation</label><br>
        <select name="menu" id="menu">
            <option value="">Mr.</option>
            <option value="">Mrs.</option>
        </select><br><br>

        <label for="name">First Name:</label>
        <input type="text" id="name" placeholder="enter ur first name"><br><br>

        <label for="last">Last name:</label>
        <input type="text" id="last" placeholder="enter ur last name"><br><br>

        <label for="gender">Gender: </label>
        <input type="radio" name="gender">male
        <input type="radio" name="gender">female<br><br>

        <label for="email"> Email:</label>
        <input type="email" id="email"><br><br>

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob"><br><br>

        <label for="add">Address:</label><br>
        <textarea name="" id="" placeholder="text some content" cols="30px" rows="10px"></textarea><br><br>

        <button type="submit">submit</button>
        </fieldset>
    </form>
</body>
</html>
