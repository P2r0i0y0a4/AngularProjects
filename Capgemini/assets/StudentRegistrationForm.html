<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
        <link rel="stylesheet" href="Studentstyle.css">

</head>
<body>
    <div class="container">
    <h1>Student Registration Form</h1>
    <br>
    <form action="">
        <label for="roll">Roll no. : </label>
        <input type="text" id="roll"><br><br>
        <label for="name">Student name : </label>
        <input type="text" id="name" placeholder="First Name"> -
        <input type="text" id="name" placeholder="Last Name"><br><br>
        <label for="father">Father's name : </label>
        <input type="text" id="father"><br><br>
        <label for="dob">Date of birth : </label>
        <input type="text" id="dob" placeholder="Day" size="4">
        <input type="text" id="dob" placeholder="Month" size="6">
        <input type="text" id="dob" placeholder="Year" size="6">
        <i>(DD-MM-YYYY)</i><br><br>
        <label for="mobile">Mobile no. : </label>
        <input type="text" value="+91" size="3"> -
        <input type="number" id="mobile"><br><br>

        <label for="email">Email id :</label>
        <input type="email" id="email"><br><br>

        <label for="pass">Password :</label>
        <input type="password" id="pass"><br><br>

         <label>Gender :</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female<br><br>

         <label>Department :</label>
        <input type="checkbox"> CSE
        <input type="checkbox"> IT
        <input type="checkbox"> ECE
        <input type="checkbox"> Civil
        <input type="checkbox"> Mech<br><br>

        <label>Course :</label>
        <select>
            <option>----------- Select Current Course -----------</option>
            <option>B.E</option>
            <option>B.Tech</option>
            <option>M.E</option>
            <option>M.Tech</option>
        </select><br><br>

         <label>Student photo :</label>
        <input type="file"><br><br>

        <label>City :</label>
        <input type="text"><br><br>

        <label for="add">Address :</label>
        <textarea name="" id="add" cols="30px" rows="5px"></textarea><br><br>

        <div class="btn">
            <button type="submit">Register</button>
        </div>        
    </form>
    </div>
</body>
</html>
