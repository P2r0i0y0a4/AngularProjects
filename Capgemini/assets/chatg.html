<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body style="background-color:#fde3dc;">

<center>
    <h1>Student Registration Form</h1>
</center>

<table cellpadding="6" cellspacing="4" align="center">

    <tr>
        <td>Roll no. :</td>
        <td><input type="text" style="width:300px;"></td>
    </tr>

    <tr>
        <td>Student name :</td>
        <td>
            <input type="text" placeholder="First Name" style="width:144px;">
            <input type="text" placeholder="Last Name" style="width:144px;">
        </td>
    </tr>

    <tr>
        <td>Father's name :</td>
        <td><input type="text" style="width:300px;"></td>
    </tr>

    <tr>
        <td>Date of birth :</td>
        <td>
            <input type="text" placeholder="Day" style="width:46px;">
            <input type="text" placeholder="Month" style="width:55px;">
            <input type="text" placeholder="Year" style="width:62px;">
            <i>(DD-MM-YYYY)</i>
        </td>
    </tr>

    <tr>
        <td>Mobile no. :</td>
        <td>
            <input type="text" value="+91" style="width:40px;"> -
            <input type="text" style="width:240px;">
        </td>
    </tr>

    <tr>
        <td>Email id :</td>
        <td><input type="email" style="width:300px;"></td>
    </tr>

    <tr>
        <td>Password :</td>
        <td><input type="password" style="width:300px;"></td>
    </tr>

    <tr>
        <td>Gender :</td>
        <td>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
        </td>
    </tr>

    <tr>
        <td>Department :</td>
        <td>
            <input type="checkbox"> CSE
            <input type="checkbox"> IT
            <input type="checkbox"> ECE
            <input type="checkbox"> Civil
            <input type="checkbox"> Mech
        </td>
    </tr>

    <tr>
        <td>Course :</td>
        <td>
            <select style="width:300px;">
                <option>----------- Select Current Course -----------</option>
                <option>B.E</option>
                <option>B.Tech</option>
                <option>M.E</option>
                <option>M.Tech</option>
            </select>
        </td>
    </tr>

    <tr>
        <td>Student photo :</td>
        <td><input type="file"></td>
    </tr>

    <tr>
        <td>City :</td>
        <td><input type="text" style="width:300px;"></td>
    </tr>

    <tr>
        <td>Address :</td>
        <td>
            <textarea rows="5" cols="34"></textarea>
        </td>
    </tr>

    <tr>
        <td colspan="2" align="center">
            <button>Register</button>
        </td>
    </tr>

</table>

</body>
</html>
