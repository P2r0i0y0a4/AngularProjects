<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
    <h1>Registration Form</h1>
    <label for="name">First Name : </label>
    <input type="text" id="name" placeholder="Enter First Name" required><br>
    <label for="lname">Last Name : </label>
    <input type="text" id="lname" placeholder="Enter Last Name" required><br>
    <label for="email">Email : </label>
    <input type="email" name="email" id="email" placeholder="Enter Email Address" required><br>
    <label for="pwd">Password : </label>
    <input type="password" id="pwd"><br>
    <label for="gender">Gender:</label><br>
    Male <input type="radio" name="gender" id="gender"><br>
    Female <input type="radio" name="gender" id="gender"><br>
    Other <input type="radio" name="gender" id="gender"><br>
    <label for="age">Age : </label>
    <input type="number" id="age"><br>
    <label for="prefer">Preferences : </label><br>
    Acrylic Painting <input type="checkbox" id="prefer"><br>
    Oil Painting <input type="checkbox" id="prefer"><br>
    Water Color <input type="checkbox" id="prefer"><br>
    <label for="occupation"> Select Occupation </label>
    <select name="" id="">
    <option value="Student">Student</option>
    <option value="teacher">teacher</option>
    <option value="Doctor">Doctor</option>
    </select><br>
    <label for="">Bio</label>
    <textarea name="Commands" id="cmd" rows="5px" cols="30px" placeholder="Share few lines about yourself..."></textarea><br>
    <button type="reset">RESET</button>
    <button type="submit">SUBMIT</button>
    </form>
</body>
</html>
