<section class="bg-gray-100 min-h-screen p-8">
  <h1 class="text-3xl font-bold text-center text-violet-700 mb-8">
    Product List
  </h1>

  <div class="grid md:grid-cols-3 gap-6">
    
    @for(item of products; track item.id) {
      <div class="bg-white rounded-2xl shadow-lg p-5 hover:scale-105 transition">
        <img 
          [src]="item.image" 
          alt="{{item.title}}" 
          class="h-48 w-full object-contain mb-4">
        <h2 class="text-lg font-semibold text-gray-800 mb-2">
          {{item.title}}
        </h2>

        <!-- Category -->
        <p class="text-sm text-gray-500 mb-2">
          {{item.category}}
        </p>

        <!-- Price -->
        <p class="text-xl font-bold text-green-600 mb-2">
          ₹ {{item.price}}
        </p>

        <!-- Description -->
        <p class="text-sm text-gray-600 line-clamp-3 mb-3">
          {{item.description}}
        </p>



        <button 
          class="w-full mt-3 bg-violet-600 text-white py-2 rounded-lg hover:bg-violet-700 transition">
          Add to Cart
        </button>

      </div>
    }

  </div>
</section>
