<section class="min-h-screen flex items-center justify-center bg-amber-50">
  <div class="bg-white rounded-2xl shadow-xl p-10 w-full max-w-md">
    <h1 class="text-3xl font-bold text-center text-amber-600 mb-6">Create Account</h1>

    <form (ngSubmit)="onSubmit(myform)" #myform="ngForm">
      <div class="mb-4">
        <label class="block text-gray-700 mb-2">Full Name</label>
        <input type="text" 
        name="name"
        [(ngModel)]="user.name"
        placeholder="Enter your full name" class="w-full shadow-sm shadow-amber-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 mb-2">Email</label>
        <input type="email" 
          name="email"
          [(ngModel)]="user.email"
          placeholder="Enter your email" class="w-full shadow-sm shadow-amber-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
      </div>

      <div class="mb-6">
        <label class="block text-gray-700 mb-2">Password</label>
        <input type="password" 
         name="password"
         [(ngModel)]="user.password" placeholder="Enter your password" class="w-full shadow-sm shadow-amber-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
      </div>

      <button class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 px-4 rounded-lg transition">Sign Up</button>
    </form>

    <p class="mt-4 text-center text-gray-600">
      Already have an account? 
      <a routerLink="/login" class="text-amber-500 font-semibold hover:underline">Login</a>
    </p>
  </div>
</section>
