<section class="min-h-screen flex items-center justify-center bg-amber-50">
  <div class="bg-white rounded-2xl shadow-xl p-10 w-full max-w-md">
    <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">Welcome Back</h1>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      
      <div class="mb-4">
        <label class="block text-gray-700 mb-2">Email</label>
        <input type="email" 
          name="email"
          [(ngModel)]="email"
          required
          placeholder="Enter your email" 
          class="w-full shadow-sm shadow-blue-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>

      <div class="mb-6">
        <label class="block text-gray-700 mb-2">Password</label>
        <input type="password" 
          name="password"
          [(ngModel)]="password" 
          required
          placeholder="Enter your password" 
          class="w-full shadow-sm shadow-blue-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>

      <button 
        type="submit"
        [disabled]="loginForm.invalid"
        class="w-full bg-amber-500 hover:bg-amber-600 disabled:bg-gray-300 text-white font-bold py-2 px-4 rounded-lg transition">
        Login
      </button>
    </form>

    <p class="mt-4 text-center text-gray-600">
      Don't have an account? 
      <a routerLink="/sign-up" class="text-blue-500 font-semibold hover:underline">Sign Up</a>
    </p>
  </div>
</section>
